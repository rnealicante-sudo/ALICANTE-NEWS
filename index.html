    const playTeletypeSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1760, now + 0.08);
        osc.frequency.setValueAtTime(1320, now + 0.16);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {
        console.warn('AudioContext disabled or error', e);
      }

    // Chunks text to highlight town names in React
    function renderHighlightedChunks(text, targetMun, isAlicanteMode) {
      if (!text) return null;
      if (!isAlicanteMode) return text;

      // Build regex with all Alicante towns sorted by length descending
      const sortedTowns = [...ALICANTE_TOWNS].sort((a, b) => b.length - a.length);
      const pattern = new RegExp(`\\b(${sortedTowns.map(escapeRegex).join('|')})\\b`, 'gi');

      const parts = [];
      let lastIndex = 0;
      let match;

      while ((match = pattern.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push(text.substring(lastIndex, match.index));
        }
        parts.push(
          React.createElement(
            'mark',
            {
              key: `m-${match.index}`,
              className: 'bg-amber-400 text-slate-950 font-black px-1.5 py-0.5 rounded shadow-sm inline-block mx-0.5 border border-amber-300',
              title: `Población: ${match[0]}`
            },
            `📍 ${match[0]}`
          )
        );
        lastIndex = pattern.lastIndex;
      }

      if (lastIndex < text.length) {
        parts.push(text.substring(lastIndex));
      }

    // Helper functions for parsing and categorizing
    const stripHtml = (html) => {
      if (!html) return '';
      return html
        .replace(/<[^>]*>?/gm, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .trim();
    };

    const detectCategory = (title, summary) => {
      const text = `${title} ${summary}`.toLowerCase();
      if (/incendio|fuego|desalojo|accidente|choque|colisión|herido|fallecid|fallece|muerte|muere|atropello|rescate|detenido|policía|guardia civil|bomberos|drogas|robo|hurto|sucesos|112|alerta|emergencia|susto|ahogado/i.test(text)) return 'sucesos';
      if (/tráfico|carretera|a-7|ap-7|n-332|retenciones|obras|autovía|tram|autobús|estación|vuelo|aeropuerto|renfe|ave|puerto|circulación/i.test(text)) return 'trafico';
      if (/ayuntamiento|alcalde|alcaldesa|pleno|pp|psoe|vox|compromís|concejal|diputación|consell|generalitat|partido|moción|elecciones|gobierno/i.test(text)) return 'politica';
      if (/economía|empresa|comercio|empleo|paro|pyme|inversión|mercado|precios|impuestos|pib/i.test(text)) return 'economia';
      if (/sanidad|hospital|médico|salud|urgencias|centro de salud|médica|pacientes|quirófano|listas de espera|virus|vacuna/i.test(text)) return 'sanidad';
      if (/universidad|ua|umh|colegio|escuela|alumnos|profesores|docentes|educación|fp|instituto|becas/i.test(text)) return 'educacion';
      if (/hércules|hercules|elche cf|lucentum|baloncesto|fútbol|partido|derbi|liga|maratón|pádel|tenis|triatlón|medalla|entrenador/i.test(text)) return 'deportes';
      if (/clima|aemet|avamet|tiempo|lluvia|temporal|viento|dana|frío|calor|nieve|tormenta|alerta meteorológica|olas/i.test(text)) return 'medio-ambiente';
      if (/turismo|hotel|playa|turistas|ocupación hotelera|costa blanca|crucero|hostelería/i.test(text)) return 'turismo';
      if (/teatro|concierto|exposición|museo|fiestas|hogueras|moros y cristianos|semana santa|cine|festival|música|cultura/i.test(text)) return 'cultura';
      return 'sociedad';
    };

    const detectMunicipality = (title, summary, sourceId) => {
      const text = ` ${title} ${summary} `.toLowerCase();
      const isAlicanteSource = /alicante|ser-alicante|cope-alicante|ondacero-alicante|informacion|todoalicante|diputacion|ayto-alicante|ayto-elche|ayto-torrevieja|ayto-benidorm|ua-universidad|marq-alicante/i.test(sourceId);

      for (const mun of ALICANTE_LOCATIONS_MAP) {
        for (const alias of mun.aliases) {
          const regex = new RegExp(`\\b${alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
          if (regex.test(text)) {
            return { municipality: mun.name, scope: mun.scope, isAlicanteProvincia: true };
          }
        }
      }

      if (isAlicanteSource) {
        let mentionsOther = false;
        for (const excluded of EXCLUDED_NON_ALICANTE) {
          const regex = new RegExp(`\\b${excluded}\\b`, 'i');
          if (regex.test(text)) {
            mentionsOther = true;
            break;
          }
        }
        if (!mentionsOther) {
          return { municipality: 'Alicante', scope: 'ciudad', isAlicanteProvincia: true };
        }
      }

      return { municipality: undefined, scope: 'provincia', isAlicanteProvincia: false };
    };

    const groupNewsClientSide = (items) => {
      const sorted = [...items].sort((a, b) => new Date(b.publishedAt).getTime() - new Date(a.publishedAt).getTime());
      const groups = [];
      const assigned = new Set();

      for (let i = 0; i < sorted.length; i++) {
        const item = sorted[i];
        if (assigned.has(item.id)) continue;

        const groupItems = [item];
        assigned.add(item.id);

        const itemTime = new Date(item.publishedAt).getTime();
        const normTitleA = item.title.toLowerCase().replace(/[^\w\s]/g, '').trim();

        for (let j = i + 1; j < sorted.length; j++) {
          const candidate = sorted[j];
          if (assigned.has(candidate.id)) continue;

          const candTime = new Date(candidate.publishedAt).getTime();
          const hoursDiff = Math.abs(itemTime - candTime) / (1000 * 60 * 60);

          if (hoursDiff <= 48) {
            const normTitleB = candidate.title.toLowerCase().replace(/[^\w\s]/g, '').trim();
            // Check word overlap
            const wordsA = normTitleA.split(/\s+/).filter(w => w.length > 3);
            const wordsB = new Set(normTitleB.split(/\s+/).filter(w => w.length > 3));
            let matchCount = 0;
            wordsA.forEach(w => { if (wordsB.has(w)) matchCount++; });
            const similarity = wordsA.length > 0 ? matchCount / wordsA.length : 0;

            if (similarity >= 0.45 || normTitleA === normTitleB) {
              groupItems.push(candidate);
              assigned.add(candidate.id);
            }
          }
        }

        const primary = groupItems[0];
        groups.push({
          id: primary.id,
          mainTitle: primary.title,
          summary: primary.summary,
          category: primary.category,
          municipality: primary.municipality,
          scope: primary.scope,
          isAlicanteProvincia: primary.isAlicanteProvincia,
          publishedAt: primary.publishedAt,
          status: primary.status || 'previous',
          sourcesCount: groupItems.length,
          sources: groupItems.map(g => ({
            source: g.source,
            sourceId: g.sourceId,
            sourceDomain: g.sourceDomain,
            title: g.title,
            link: g.link,
            publishedAt: g.publishedAt
          }))
        });
      }

      return groups;
    };

    const fetchSingleFeedClient = async (source) => {
      // List of CORS proxies to ensure reliable static fetching
      const proxies = [
        (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
      ];

      for (const getProxyUrl of proxies) {
        try {
          const proxyUrl = getProxyUrl(source.rssUrl);
          const res = await fetch(proxyUrl, { cache: 'no-store' });
          if (!res.ok) continue;
          const text = await res.text();
          if (!text || (!text.includes('<rss') && !text.includes('<feed') && !text.includes('<xml') && !text.includes('<item') && !text.includes('<entry'))) {
            continue;
          }

          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, 'text/xml');
          const itemNodes = xmlDoc.querySelectorAll('item, entry');

          if (!itemNodes || itemNodes.length === 0) continue;

          const items = [];
          const nowIso = new Date().toISOString();

          Array.from(itemNodes).slice(0, 15).forEach((node) => {
            const title = node.querySelector('title')?.textContent || '';
            const cleanTitle = stripHtml(title).trim();
            if (!cleanTitle || cleanTitle.length < 5) return;

            const summary = node.querySelector('description, summary, content')?.textContent || '';
            const cleanSummary = stripHtml(summary).slice(0, 300).trim();

            let link = node.querySelector('link')?.textContent || '';
            if (!link && node.querySelector('link')?.getAttribute('href')) {
              link = node.querySelector('link').getAttribute('href');
            }
            if (!link || !link.startsWith('http')) link = source.websiteUrl;

            const pubDateStr = node.querySelector('pubDate, published, updated, date')?.textContent;
            let validPubDate = nowIso;
            if (pubDateStr) {
              const d = new Date(pubDateStr);
              if (!isNaN(d.getTime())) {
                validPubDate = d.toISOString();
              }
            }

            const category = detectCategory(cleanTitle, cleanSummary);
            const { municipality, scope, isAlicanteProvincia } = detectMunicipality(cleanTitle, cleanSummary, source.id);
            const articleKey = `${source.id}::${cleanTitle.slice(0, 50).toLowerCase()}`;

            const existing = clientArticlesDb.get(articleKey);
            const status = existing ? 'previous' : 'new';

            const newsItem = {
              id: articleKey,
              title: cleanTitle,
              summary: cleanSummary,
              link,
              source: source.name,
              sourceId: source.id,
              sourceDomain: source.domain,
              publishedAt: validPubDate,
              status,
              category,
              municipality,
              scope,
              isAlicanteProvincia
            };

            clientArticlesDb.set(articleKey, newsItem);
            items.push(newsItem);
          });

          return { ok: true, count: items.length, items };
        } catch (e) {
          // try next proxy
        }
      }

      return { ok: false, count: 0, items: [] };
    };

      if (!isoString) return '--:--';
      try {

        if (isNaN(d.getTime())) return '--:--';
        return d.toLocaleTimeString('es-ES', {
          hour: '2-digit',

          second: includeSeconds ? '2-digit' : undefined
        });
      } catch (e) {
        return '--:--';

    };

          if (saved) return JSON.parse(saved);

        return { teletipos: true, destacadas: true, radio: true };

      const isLight = theme === 'light';

      // Digital Clock
      useEffect(() => {
        const updateClock = () => {

          setTimeString(now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));

        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);

      useEffect(() => {

          document.body.style.color = '#0f172a';

      useEffect(() => {

      // Core Live Fetch Function with Client-Side Static & Live Proxy Engine
      const fetchLiveData = useCallback(async (isManual = false) => {
        if (isManual) setIsRefreshing(true);
        const checkTimestamp = new Date().toISOString();
        const checkTime = formatTime(checkTimestamp, true);

        try {
          // 1. Try local/backend API first (if running with node server)
          let backendSuccess = false;
          try {
            const endpoint = isManual ? '/api/news/refresh' : '/api/news';
            const options = isManual ? { method: 'POST' } : { method: 'GET' };
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const res = await fetch(endpoint, { ...options, signal: controller.signal });
            clearTimeout(timeoutId);

            if (res.ok) {
              const data = await res.json();
              if (data.news && data.news.length > 0) {
                setGroupedNews(data.groupedNews || []);
                setRawNews(data.news || []);
                setHighlightedNews(data.highlightedNews || []);
                setLastSourcesCheck(data.lastSourcesCheck || data.timestamp);
                setLatestPublishedAt(data.latestPublishedAt || null);
                setSourceStatuses(data.sourceStatuses || {});
                setConnectionStatus(data.status || 'live');
                setStatusMessage(data.statusMessage || 'Sincronizado con fuentes en tiempo real');

                const newCount = data.newCount || 0;
                const updatedCount = data.updatedCount || 0;

                if (newCount > 0) {
                  if (soundEnabled) playTeletypeSound();
                  setToastMsg(`🟢 ¡${newCount} NUEVA(S) NOTICIA(S) DETECTADA(S)! Sincronizadas a las ${checkTime}`);
                  setLastSyncReport(`🟢 Detectadas ${newCount} noticias nuevas y ${updatedCount} actualizadas a las ${checkTime}`);
                } else if (updatedCount > 0) {
                  if (soundEnabled) playTeletypeSound();
                  setToastMsg(`🔵 ¡${updatedCount} NOTICIA(S) ACTUALIZADA(S)! A las ${checkTime}`);
                  setLastSyncReport(`🔵 ${updatedCount} noticias actualizadas por los medios a las ${checkTime}`);
                } else {
                  setLastSyncReport(`✓ Comprobación completada a las ${checkTime}. Fuentes oficiales sincronizadas.`);
                }
                setTimeout(() => setToastMsg(null), 7000);
                backendSuccess = true;
              }
            }
          } catch (e) {
            // Backend not available (static host/GitHub Pages/file protocol) -> proceed to client-side fetcher
            backendSuccess = false;
          }

          // 2. If static host or backend didn't return data, fetch directly via client RSS engine
          if (!backendSuccess) {
            const sourceStatusRecord = {};
            let fetchedItemsCount = 0;
            let newlyFound = 0;

            const results = await Promise.allSettled(
              SOURCES.map(async (src) => {
                const res = await fetchSingleFeedClient(src);
                sourceStatusRecord[src.id] = {
                  ok: res.ok,
                  count: res.count,
                  lastChecked: checkTimestamp,
                  lastSuccessAt: res.ok ? checkTimestamp : undefined
                };
                return res.items || [];
              })
            );

            const allFetchedArticles = [];
            results.forEach((r) => {
              if (r.status === 'fulfilled' && Array.isArray(r.value)) {
                r.value.forEach((item) => {
                  allFetchedArticles.push(item);
                  if (item.status === 'new') newlyFound++;
                });
              }
            });

            // If some feeds failed due to public proxy limits, combine with already collected cache
            const allDatabaseArticles = Array.from(clientArticlesDb.values());
            const combinedArticles = allDatabaseArticles.length > 0 ? allDatabaseArticles : allFetchedArticles;

            if (combinedArticles.length > 0) {
              const groups = groupNewsClientSide(combinedArticles);
              setGroupedNews(groups);
              setRawNews(combinedArticles);
              setHighlightedNews(groups.slice(0, 6));
              setLastSourcesCheck(checkTimestamp);
              setLatestPublishedAt(combinedArticles[0]?.publishedAt || checkTimestamp);
              setSourceStatuses(sourceStatusRecord);
              setConnectionStatus('live');
              setStatusMessage('Fuentes oficiales conectadas y sincronizadas en tiempo real');

              if (newlyFound > 0) {
                if (soundEnabled) playTeletypeSound();
                setToastMsg(`🟢 ¡${newlyFound} NOTICIA(S) DETECTADA(S)! Sincronizadas a las ${checkTime}`);
                setLastSyncReport(`🟢 Detectadas ${newlyFound} noticias en directo a las ${checkTime}`);
              } else {
                setLastSyncReport(`✓ Sincronizado a las ${checkTime}. ${combinedArticles.length} noticias activas en el teletipo.`);
              }
              setTimeout(() => setToastMsg(null), 7000);
            } else {
              setConnectionStatus('source_error');
              setStatusMessage('Conectando con fuentes...');
            }
          }
        } catch (err) {
          console.error('Error in fetchLiveData:', err);
          setConnectionStatus('source_error');
          setStatusMessage('Incidencia temporal al consultar fuentes');
        } finally {
          if (isManual) setIsRefreshing(false);
        }

      useEffect(() => {

                const defaultOrder = ['teletipos', 'destacadas', 'radio'];
                const defaultVis = { teletipos: true, destacadas: true, radio: true };
                setSectionOrder(defaultOrder);
                setSectionVisibility(defaultVis);
                localStorage.setItem('teletipo_section_order', JSON.stringify(defaultOrder));
                localStorage.setItem('teletipo_section_visibility', JSON.stringify(defaultVis));
              }}
              onClose={() => setShowPersonalize(false)}
            />
          )}

          {/* ESCALETA MODAL */}
          {showEscaleta && (
            <EscaletaModal
              news={filteredGroups}
              onClose={() => setShowEscaleta(false)}
            />
          )}

          {/* SOURCES MONITOR MODAL WITH LIVE STATUS */}
          {showSources && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#0a0f18] border border-[#1e293b] p-6 rounded-xl max-w-2xl w-full text-white space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-bold text-lg">Monitor de Fuentes Oficiales y Medios</h3>
                    <p className="text-xs text-slate-400">Estado de sincronización en tiempo real con las fuentes de Alicante</p>
                  </div>
                  <button onClick={() => setShowSources(false)} className="text-slate-400 hover:text-white font-bold"><IconX className="w-5 h-5"/></button>
                </div>
                <div className="space-y-2 text-xs flex-1 overflow-y-auto pr-1">
                  {SOURCES.map((src) => {
                    const st = sourceStatuses[src.id] || { ok: true, count: 5, lastChecked: new Date().toISOString() };
                    return (
                      <div key={src.id} className="p-2.5 bg-slate-900 border border-slate-800 rounded flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                          <span className={`w-2 h-2 rounded-full ${st.ok ? 'bg-emerald-400' : 'bg-amber-500'}`}></span>
                          <div>
                            <div className="font-semibold text-white">{src.name}</div>
                            <div className="text-[10px] text-slate-400 font-mono">{src.domain} ({src.type})</div>
                          </div>
                        </div>
                        <div className="flex items-center space-x-3 text-slate-400 font-mono text-right">
                          <span>{st.ok ? `${st.count || 0} noticias` : 'Incidencia temporal'}</span>
                          <span className="text-[10px] text-slate-500">{formatTime(st.lastChecked, true)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- ESCALETA MODAL COMPONENT ---
    function EscaletaModal({ news, onClose }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [rate, setRate] = useState(1.0);
      const [copied, setCopied] = useState(false);
      const [vuLevels, setVuLevels] = useState(Array(20).fill(4));

      useEffect(() => {
        let interval;
        if (isPlaying && !isPaused) {
          interval = setInterval(() => {
            setVuLevels(Array.from({ length: 20 }, () => Math.floor(Math.random() * 85) + 12));
          }, 70);
        } else {
          setVuLevels(Array(20).fill(4));
        }
        return () => clearInterval(interval);
      }, [isPlaying, isPaused]);

      const topNews = news.slice(0, 6);

      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const daysOfWeek = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const dayName = daysOfWeek[now.getDay()];
      const dayNumber = now.getDate();
      const monthName = months[now.getMonth()];
      const year = now.getFullYear();

      const timeSpoken = `Son las ${hours} ${hours === 1 ? 'hora' : 'horas'} y ${minutes === 0 ? 'en punto' : minutes === 1 ? 'un minuto' : `${minutes} minutos`} del ${dayName}, ${dayNumber} de ${monthName} de ${year}`;
      const introScript = `${timeSpoken}. Emite Central Telegráfica de Noticias de Alicante. Presentamos el boletín informativo con la actualidad verificada de Alicante y provincia.`;

      const newsScripts = topNews.map((group, i) => ({
        index: i + 1,
        title: group.mainTitle,
        spokenText: `${group.mainTitle}. ${group.summary || ''}. Información contrastada por ${group.sources[0]?.source || 'fuente oficial'}.`
      }));

      const outroScript = "Hasta aquí las principales noticias en este boletín informativo de Alicante. Continúen informados en tiempo real en nuestra Central de Teletipos. Gracias por su sintonía.";

      const fullText = [introScript, ...newsScripts.map(n => n.spokenText), outroScript].join(' ');

      const handleSpeak = () => {
        if (!('speechSynthesis' in window)) {
          alert('Tu navegador no soporta reproducción de voz.');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'es-ES';
        utterance.rate = rate;
        utterance.onend = () => setIsPlaying(false);
        utterance.onerror = () => setIsPlaying(false);
        setIsPlaying(true);
        setIsPaused(false);
        window.speechSynthesis.speak(utterance);
      };

      const handlePause = () => {
        if ('speechSynthesis' in window) {
          if (isPaused) {
            window.speechSynthesis.resume();
            setIsPaused(false);
          } else {
            window.speechSynthesis.pause();
            setIsPaused(true);
          }
        }
      };

      const handleStop = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsPlaying(false);
        setIsPaused(false);
      };

      const handleCopy = () => {
        const text = `--- BOLETÍN DE RADIO ALICANTE ---\nFecha: ${now.toLocaleDateString()}\n\n[ENTRADILLA]\n${introScript}\n\n[DESARROLLO DE NOTICIAS]\n${newsScripts.map(n => n.spokenText).join('\n\n')}\n\n[CIERRE]\n${outroScript}`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0a0f18] border border-[#1e293b] rounded-xl max-w-3xl w-full text-white flex flex-col max-h-[92vh] overflow-hidden shadow-2xl">
            
            {/* Header */}
            <div className="p-4 border-b border-[#1e293b] bg-slate-950 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className={`p-2 rounded-full border transition ${
                  isPlaying && !isPaused
                    ? 'bg-red-600/30 border-red-500 text-red-500 animate-pulse'
                    : 'bg-slate-900 border-slate-800 text-slate-400'
                }`}>
                  <IconMic className={`w-5 h-5 ${isPlaying && !isPaused ? 'animate-bounce text-red-500' : ''}`} />
                </div>
                <div>
                  <h3 className="font-black text-sm uppercase tracking-wider flex items-center space-x-2">
                    <span>MODO ESCALETA & BOLETÍN DE RADIO</span>
                    <span className="bg-amber-500 text-black text-[10px] font-black px-1.5 py-0.5 rounded">ALICANTE</span>
                  </h3>
                  <p className="text-[11px] text-slate-400 font-mono">Lectura automática del boletín en tiempo real</p>
                </div>
              </div>

              {/* Status Mic Badge */}
              <div className="flex items-center space-x-2">
                {isPlaying && !isPaused ? (
                  <div className="flex items-center space-x-2 bg-red-600/20 border border-red-500/50 px-3 py-1 rounded-full text-red-400 font-mono font-bold text-xs uppercase animate-pulse">
                    <span className="relative flex h-2.5 w-2.5">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                    </span>
                    <span className="tracking-widest">MIC ON AIR</span>
                  </div>
                ) : (
                  <div className="flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-400 font-mono text-xs font-bold uppercase">
                    <span className="w-2 h-2 rounded-full bg-slate-600"></span>
                    <span>MIC EN ESPERA</span>
                  </div>
                )}

                <button onClick={() => { handleStop(); onClose(); }} className="text-slate-400 hover:text-white p-1">
                  <IconX className="w-5 h-5"/>
                </button>
              </div>
            </div>

            {/* Audio Controls Bar */}
            <div className="p-3 bg-[#0f172a] border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center space-x-2">
                {!isPlaying ? (
                  <button onClick={handleSpeak} className="bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded font-black text-xs uppercase flex items-center space-x-1.5 shadow transition">
                    <IconPlay className="w-4 h-4 fill-current" />
                    <span>Escuchar Boletín</span>
                  </button>
                ) : (
                  <>
                    <button onClick={handlePause} className="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded font-black text-xs uppercase flex items-center space-x-1 transition">
                      {isPaused ? <IconPlay className="w-4 h-4" /> : <IconPause className="w-4 h-4" />}
                      <span>{isPaused ? 'Reanudar' : 'Pausar'}</span>
                    </button>
                    <button onClick={handleStop} className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded font-black text-xs uppercase flex items-center space-x-1 transition">
                      <IconSquare className="w-4 h-4" />
                      <span>Detener</span>
                    </button>
                  </>
                )}
                
                <div className="flex items-center space-x-1 text-xs font-mono ml-2">
                  <span className="text-slate-400">Velocidad:</span>
                  {[1.0, 1.2, 1.4].map(r => (
                    <button
                      key={r}
                      onClick={() => setRate(r)}
                      className={`px-2 py-0.5 rounded font-bold ${rate === r ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                    >
                      {r}x
                    </button>
                  ))}
                </div>
              </div>

              <button onClick={handleCopy} className="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-3 py-1.5 rounded flex items-center space-x-1 border border-slate-700 transition">
                {copied ? <IconCheck className="w-4 h-4 text-emerald-400" /> : <IconCopy className="w-4 h-4" />}
                <span>{copied ? 'Copiado' : 'Copiar Guion'}</span>
              </button>
            </div>

            {/* VÚMETRO DIGITAL ESTUDIO */}
            <div className="px-4 py-3 bg-[#050608] border-b border-slate-800/80 space-y-1.5">
              <div className="flex items-center justify-between text-[10px] font-mono font-bold uppercase tracking-widest text-slate-400">
                <div className="flex items-center space-x-2">
                  <span className={`w-2 h-2 rounded-full ${isPlaying && !isPaused ? 'bg-red-500 animate-ping' : 'bg-slate-600'}`}></span>
                  <span>VÚMETRO DIGITAL DE AUDICIÓN EN DIRECTO</span>
                </div>
                <span className={`font-mono text-xs ${isPlaying && !isPaused ? 'text-emerald-400 font-extrabold' : 'text-slate-600'}`}>
                  {isPlaying && !isPaused ? 'PROCESANDO AUDIO EN DIRECTO (-3 dB)' : 'EN ESPERA (STANDBY 0 dB)'}
                </span>
              </div>

              {/* LED Meter Bars */}
              <div className="flex items-end justify-between gap-1 h-12 bg-black/90 p-2 rounded-lg border border-slate-800/80 shadow-inner">
                {vuLevels.map((lvl, idx) => (
                  <div key={idx} className="h-full flex-1 bg-slate-900/80 rounded-xs flex flex-col justify-end overflow-hidden">
                    <div
                      className={`w-full transition-all duration-75 rounded-xs ${
                        lvl > 80
                          ? 'bg-gradient-to-t from-emerald-500 via-amber-400 to-red-500'
                          : lvl > 45
                          ? 'bg-gradient-to-t from-emerald-500 to-amber-400'
                          : 'bg-emerald-500'
                      }`}
                      style={{ height: `${lvl}%` }}
                    />
                  </div>
                ))}
              </div>

              <div className="flex items-center justify-between text-[9px] font-mono text-slate-500 uppercase px-0.5">
                <span>-40 dB</span>
                <span>-20 dB</span>
                <span>-10 dB</span>
                <span className="text-red-500 font-bold">0 dB PEAK</span>
              </div>
            </div>

            {/* Script Text Container */}
            <div className="p-4 overflow-y-auto space-y-4 font-serif text-sm leading-relaxed">
              <div className="p-3 bg-slate-900/90 border border-slate-800 rounded-lg">
                <span className="font-sans font-black text-red-500 text-xs block mb-1 uppercase tracking-wider">CARETA DE ENTRADA:</span>
                "{introScript}"
              </div>

              {newsScripts.map((n, idx) => (
                <div key={idx} className="p-3 bg-[#0f172a] border border-slate-800 rounded-lg">
                  <span className="font-sans font-black text-amber-400 text-xs block mb-1 uppercase tracking-wider">BOLETÍN:</span>
                  "{n.spokenText}"
                </div>
              ))}

              <div className="p-3 bg-slate-900/90 border border-slate-800 rounded-lg">
                <span className="font-sans font-black text-red-500 text-xs block mb-1 uppercase tracking-wider">CARETA DE CIERRE:</span>
                "{outroScript}"
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- PERSONALIZE MODAL COMPONENT ---
    function PersonalizeModal({ sectionOrder, sectionVisibility, onUpdateOrder, onToggleVisibility, onReset, onClose }) {
      const sectionLabels = {
        teletipos: '🔴 ÚLTIMA HORA - ÚLTIMOS TELETIPOS ALICANTE',
        destacadas: '⭐ Las noticias más destacadas de hoy',
        radio: '📻 EMISORAS DE RADIO DE ALICANTE EN DIRECTO'
      };

      const moveSection = (index, direction) => {
        const newOrder = [...sectionOrder];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= newOrder.length) return;
        const temp = newOrder[index];
        newOrder[index] = newOrder[targetIndex];
        newOrder[targetIndex] = temp;
        onUpdateOrder(newOrder);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0a0f18] border border-[#1e293b] rounded-2xl max-w-lg w-full text-white overflow-hidden shadow-2xl space-y-4">
            
            {/* Header */}
            <div className="p-4 bg-gradient-to-r from-amber-950 via-slate-900 to-amber-950 border-b border-amber-500/30 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <IconSliders className="w-5 h-5 text-amber-400" />
                <h3 className="font-black text-sm uppercase tracking-wider text-amber-400">
                  PERSONALIZAR PORTADA Y SECCIONES
                </h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <IconX className="w-5 h-5" />
              </button>
            </div>

            {/* Description */}
            <div className="px-5 text-xs text-slate-300 leading-relaxed">
              Elige qué secciones quieres ver en la portada y cámbiales el orden para priorizar lo que más te interese ver primero:
            </div>

            {/* Section List */}
            <div className="px-5 space-y-3">
              {sectionOrder.map((key, index) => {
                const isVisible = sectionVisibility[key] !== false;
                return (
                  <div
                    key={key}
                    className={`p-3.5 rounded-xl border flex items-center justify-between gap-3 transition ${
                      isVisible ? 'bg-slate-900/90 border-slate-700 text-white' : 'bg-slate-950/60 border-slate-800/60 text-slate-500'
                    }`}
                  >
                    <div className="flex items-center space-x-3 min-w-0">
                      <span className="font-mono text-xs font-bold text-amber-400 shrink-0">#{index + 1}</span>
                      <span className="font-bold text-xs truncate">{sectionLabels[key] || key}</span>
                    </div>

                    <div className="flex items-center space-x-2 shrink-0">
                      <button
                        onClick={() => moveSection(index, -1)}
                        disabled={index === 0}
                        className="p-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-300"
                        title="Mover arriba"
                      >
                        <IconChevronUp className="w-4 h-4" />
                      </button>
                      <button
                        onClick={() => moveSection(index, 1)}
                        disabled={index === sectionOrder.length - 1}
                        className="p-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-300"
                        title="Mover abajo"
                      >
                        <IconChevronDown className="w-4 h-4" />
                      </button>
                      <button
                        onClick={() => onToggleVisibility(key)}
                        className={`px-2.5 py-1 rounded text-[11px] font-bold border transition ${
                          isVisible ? 'bg-emerald-600/30 text-emerald-400 border-emerald-500/50' : 'bg-slate-800 text-slate-400 border-slate-700'
                        }`}
                      >
                        {isVisible ? 'Visible' : 'Oculto'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Footer buttons */}
            <div className="p-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
              <button
                onClick={onReset}
                className="text-xs text-slate-400 hover:text-white underline font-mono"
              >
                Restablecer por defecto
              </button>
              <button
                onClick={onClose}
                className="bg-amber-500 hover:bg-amber-400 text-black px-4 py-1.5 rounded-lg text-xs font-black uppercase shadow"
              >
                Guardar y Cerrar
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
