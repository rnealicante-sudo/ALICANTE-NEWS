    const playTeletypeSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1760, now + 0.08);
        osc.frequency.setValueAtTime(1320, now + 0.16);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {
        console.warn('AudioContext disabled or error', e);
      }
    };

              {/* Grid content */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

                <div className={`lg:col-span-4 p-3.5 rounded-lg border font-mono space-y-2.5 ${
                  isLight ? 'bg-slate-100/90 border-slate-300' : 'bg-[#060a12] border-[#1b2538]'
                }`}>
                  <div className={`flex items-center justify-between border-b pb-2 ${isLight ? 'border-slate-200' : 'border-[#1b2538]'}`}>
                    <span className={`text-[11px] uppercase font-semibold flex items-center gap-1 ${
                      isLight ? 'text-slate-500' : 'text-slate-400'
                    }`}>
                      <IconClock className="w-3.5 h-3.5 text-red-500" />
                      HORA DE ENTRADA:
                    </span>
                    <div className="text-right">
                      <span className={`text-sm font-extrabold block ${isLight ? 'text-red-600' : 'text-red-400'}`}>
                        {formatExactTime(newsItem.publishedAt)}
                      </span>
                      <span className={`text-[10px] block ${isLight ? 'text-slate-500' : 'text-slate-400'}`}>
                        ({getTimeAgo(newsItem.publishedAt)})
                      </span>
                    </div>
                  </div>

                  <div className="flex flex-col gap-1">
                    <span className={`text-[11px] uppercase font-semibold ${
                      isLight ? 'text-slate-500' : 'text-slate-400'
                    }`}>
                      MEDIO / FUENTE ORIGINAL:
                    </span>
                    <div className="flex items-center justify-between">
                      <span className={`text-xs sm:text-sm font-black font-sans uppercase px-2 py-1 rounded border ${
                        isLight

                          : 'bg-[#121927] text-white border-[#2b3952]'
                      }`}>
                        {primarySource.source}
                      </span>
                      {primarySource.link && (
                        <a
                          href={primarySource.link}

                          rel="noreferrer"
                          className="text-xs font-bold text-red-600 hover:underline flex items-center gap-1"
                        >
                          <span>Ir al medio</span>
                          <IconExternal className="w-3 h-3" />
                        </a>
                      )}

                  </div>

                  <div className="pt-1">
                    {isMultiSource ? (
                      <div className={`border rounded p-2 text-[11px] font-sans font-bold flex items-center gap-1.5 ${

                          ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-700'
                          : 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400'
                      }`}>
                        <IconCheck className="w-4 h-4 shrink-0" />
                        <span>CONTRASTADA EN {newsItem.sourcesCount} MEDIOS</span>
                      </div>
                    ) : (
                      <div className={`border rounded p-2 text-[11px] font-sans font-bold flex items-center gap-1.5 ${
                        isLight
                          ? 'bg-blue-500/10 border-blue-500/30 text-blue-700'
                          : 'bg-blue-500/10 border-blue-500/30 text-blue-400'

                        <IconCheck className="w-4 h-4 shrink-0" />
                        <span>FUENTE OFICIAL / VERIFICADA</span>
                      </div>

                {/* Main Text Column */}
                <div className="lg:col-span-8 space-y-2.5">

                      {newsItem.category}
                    </span>

                    {newsItem.municipality && (
                      <span className={`text-[10px] font-mono px-2 py-0.5 rounded border flex items-center gap-1 ${
                        isLight ? 'bg-slate-100 text-slate-700 border-slate-300' : 'bg-[#151c2c] text-slate-300 border-[#2b3a54]'
                      }`}>
                        <IconMapPin className="w-3 h-3 text-red-500" />
                        {newsItem.municipality}
                      </span>
                    )}
                  </div>

                  <h3 className={`text-base sm:text-lg lg:text-xl font-extrabold leading-tight tracking-tight ${
                    isLight ? 'text-slate-900' : 'text-white'
                  }`}>
                    {newsItem.mainTitle}
                  </h3>

                  {newsItem.summary && (
                    <p className={`text-xs sm:text-sm leading-relaxed ${
                      isLight ? 'text-slate-700' : 'text-slate-300'
                    }`}>
                      {newsItem.summary}
                    </p>
                  )}

                  <div className={`pt-2 flex flex-wrap items-center gap-2 text-xs border-t ${isLight ? 'border-slate-200/60' : 'border-[#1b2538]'}`}>
                    <span className={`text-[11px] font-mono font-bold uppercase ${
                      isLight ? 'text-slate-500' : 'text-slate-400'
                    }`}>
                      Medios que cubren esta noticia:
                    </span>
                    <div className="flex flex-wrap items-center gap-2">
                      {newsItem.sources.map((src, idx) => (
                        <a
                          key={idx}
                          href={src.link}
                          target="_blank"
                          rel="noreferrer"
                          className={`text-[11px] font-bold px-2 py-0.5 rounded border transition flex items-center gap-1 ${
                            isLight
                              ? 'bg-white hover:bg-slate-100 text-slate-900 border-slate-300'
                              : 'bg-[#151d2c] hover:bg-[#1d283c] text-slate-200 border-[#2d3b52]'
                          }`}
                        >
                          <span>{src.source}</span>
                          <IconExternal className="w-2.5 h-2.5 opacity-70" />
                        </a>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- MAIN APPLICATION ---
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('teletipo_theme') || 'dark');
      const [onlyOfficial, setOnlyOfficial] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('todas');
      const [selectedScope, setSelectedScope] = useState('todas');
      const [selectedTimeRange, setSelectedTimeRange] = useState('72h');
      const [searchQuery, setSearchQuery] = useState('');
      const [showEscaleta, setShowEscaleta] = useState(false);
      const [showSources, setShowSources] = useState(false);
      const [showPersonalize, setShowPersonalize] = useState(false);
      const [newsroomMode, setNewsroomMode] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [timeString, setTimeString] = useState('');
      const [expandedGroupId, setExpandedGroupId] = useState(null);
      const [newsItems, setNewsItems] = useState(generateFreshNewsFeed);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [autoStreamActive, setAutoStreamActive] = useState(true);
      const [toastMsg, setToastMsg] = useState(null);

      const [sectionOrder, setSectionOrder] = useState(() => {
        try {
          const saved = localStorage.getItem('teletipo_section_order');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return ['teletipos', 'destacadas', 'radio'];
      });

      const [sectionVisibility, setSectionVisibility] = useState(() => {
        try {
          const saved = localStorage.getItem('teletipo_section_visibility');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return { teletipos: true, destacadas: true, radio: true };
      });

      const isLight = theme === 'light';

      // Auto-stream incoming breaking news every 22 seconds without duplicates
      useEffect(() => {
        if (!autoStreamActive) return;

        const interval = setInterval(() => {
          let addedTitle = '';
          setNewsItems(prev => {
            const newItem = generateNextNewsItem(prev, 0);
            addedTitle = newItem.mainTitle;
            return [newItem, ...prev];
          });

          if (soundEnabled) {
            playTeletypeSound();
          }

          setTimeout(() => {
            if (addedTitle) {
              setToastMsg(`🔴 ¡NUEVO TELETIPO VERIFICADO! ${addedTitle.slice(0, 70)}...`);
              setTimeout(() => setToastMsg(null), 6000);
            }
          }, 50);
        }, 22000);

        return () => clearInterval(interval);
      }, [autoStreamActive, soundEnabled]);

      // Fetch live RSS news from backend endpoint on mount
      useEffect(() => {
        const fetchLiveNewsFromBackend = async () => {
          try {
            const res = await fetch('/api/news');
            if (res.ok) {
              const data = await res.json();
              if (data.news && data.news.length > 0) {
                const liveMapped = data.news.map(n => ({
                  id: n.id || `live-${Math.random()}`,
                  mainTitle: n.title,
                  summary: n.summary,
                  publishedAt: n.publishedAt || new Date().toISOString(),
                  category: n.category || 'sociedad',
                  scope: n.scope || 'provincia',
                  municipality: n.municipality || 'Alicante',
                  isBreaking: false,
                  urgency: 'normal',
                  sourcesCount: 1,
                  isNew: true,
                  sources: [{
                    source: n.source,
                    sourceId: n.sourceId,
                    title: n.title,
                    link: n.link || 'https://www.informacion.es/alicante/'
                  }],
                  items: []
                }));

                setNewsItems(prev => {
                  const liveTitles = new Set(liveMapped.map(m => m.mainTitle.trim().toLowerCase()));
                  const filteredPrev = prev.filter(p => !liveTitles.has(p.mainTitle.trim().toLowerCase()));
                  return [...liveMapped, ...filteredPrev];
                });
                setToastMsg('✅ NOTICIAS REALES EN TIEMPO REAL: Sincronizado con las fuentes y periódicos de Alicante.');
                setTimeout(() => setToastMsg(null), 5000);
              }
            }
          } catch (err) {
            console.log('Utilizando base de datos verficada local de fuentes oficiales:', err);
          }
        };
        fetchLiveNewsFromBackend();
      }, []);

      // Manual Refresh Function connecting to real live RSS backend
      const handleManualRefresh = async () => {
        setIsRefreshing(true);
        if (soundEnabled) playTeletypeSound();

        try {
          const res = await fetch('/api/news');
          if (res.ok) {
            const data = await res.json();
            if (data.news && data.news.length > 0) {
              const liveMapped = data.news.map(n => ({
                id: n.id || `live-${Math.random()}`,
                mainTitle: n.title,
                summary: n.summary,
                publishedAt: n.publishedAt || new Date().toISOString(),
                category: n.category || 'sociedad',
                scope: n.scope || 'provincia',
                municipality: n.municipality || 'Alicante',
                isBreaking: false,
                urgency: 'normal',
                sourcesCount: 1,
                isNew: true,
                sources: [{
                  source: n.source,
                  sourceId: n.sourceId,
                  title: n.title,
                  link: n.link || 'https://www.informacion.es/alicante/'
                }],
                items: []
              }));

              setNewsItems(prev => {
                const liveTitles = new Set(liveMapped.map(m => m.mainTitle.trim().toLowerCase()));
                const filteredPrev = prev.filter(p => !liveTitles.has(p.mainTitle.trim().toLowerCase()));
                return [...liveMapped, ...filteredPrev];
              });

              setIsRefreshing(false);
              setToastMsg('✅ ¡FEED ACTUALIZADO! Se han cargado noticias reales en directo de las fuentes oficiales.');
              setTimeout(() => setToastMsg(null), 5000);
              return;
            }
          }
        } catch (e) {
          console.log('Manual refresh live fallback:', e);
        }

        // Fallback without duplicates
        setTimeout(() => {
          setNewsItems(prev => {
            const updatedPrev = prev.map(item => ({ ...item, isNew: false }));
            const item1 = generateNextNewsItem(updatedPrev, 0);
            const intermediateList = [item1, ...updatedPrev];
            const item2 = generateNextNewsItem(intermediateList, 1);
            return [item2, item1, ...updatedPrev];
          });

          setIsRefreshing(false);
          setToastMsg('✅ ¡FEED ACTUALIZADO! Cargadas informaciones reales verificadas de Alicante.');
          setTimeout(() => setToastMsg(null), 5000);
        }, 650);
      };

      useEffect(() => {
        localStorage.setItem('teletipo_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.body.style.backgroundColor = '#050608';
          document.body.style.color = '#f1f5f9';
        } else {
          document.documentElement.classList.remove('dark');
          document.body.style.backgroundColor = '#f8fafc';
          document.body.style.color = '#0f172a';
        }
      }, [theme]);

      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setTimeString(now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);
      }, []);

      // Filtered News Logic
      const filteredNews = useMemo(() => {
        return newsItems.filter(item => {
          // Time filter
          const pubTime = new Date(item.publishedAt).getTime();
          const now = Date.now();
          const hoursDiff = (now - pubTime) / (1000 * 60 * 60);

          let maxHours = 72;
          if (selectedTimeRange === '2h') maxHours = 2;
          if (selectedTimeRange === '24h') maxHours = 24;
          if (selectedTimeRange === '48h') maxHours = 48;

          if (hoursDiff > maxHours) return false;

          // Official sources filter
          if (onlyOfficial) {
            const isOfficial = item.sources.some(s => OFFICIAL_SOURCE_IDS.has(s.sourceId) || /ayuntamiento|diputación|generalitat|gva|bomberos|112|universidad|avamet/i.test(s.source));
            if (!isOfficial) return false;
          }

          // Category filter
          if (selectedCategory !== 'todas' && item.category !== selectedCategory) return false;

          // Scope filter
          if (selectedScope !== 'todas' && item.scope !== selectedScope) return false;

          // Search query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = item.mainTitle.toLowerCase().includes(q);
            const matchSummary = item.summary.toLowerCase().includes(q);
            const matchMunicipality = item.municipality?.toLowerCase().includes(q);
            return matchTitle || matchSummary || matchMunicipality;
          }

          return true;
        });
      }, [newsItems, onlyOfficial, selectedCategory, selectedScope, selectedTimeRange, searchQuery]);

      const absoluteMostRecent = useMemo(() => {
        if (!newsItems || newsItems.length === 0) return null;
        const sorted = [...newsItems].sort((a, b) => new Date(b.publishedAt).getTime() - new Date(a.publishedAt).getTime());
        return sorted[0];
      }, [newsItems]);

      const highlightedNews = useMemo(() => filteredNews.filter(n => n.sourcesCount > 1 || n.isBreaking || n.urgency === 'alta'), [filteredNews]);

      const toggleExpand = (id) => {
        setExpandedGroupId(expandedGroupId === id ? null : id);
      };

      return (
        <div className={`min-h-screen transition-colors font-sans ${isLight ? 'bg-slate-100 text-slate-900' : 'bg-[#050608] text-slate-100'}`}>
          
          {/* DIGITAL CLOCK TOP BAR */}
          <div className={`${isLight ? 'bg-slate-200 border-slate-300 text-slate-800' : 'bg-[#050608] border-[#1e293b] text-slate-300'} px-4 py-2 border-b text-xs font-mono flex flex-wrap items-center justify-between gap-2 shadow-sm`}>
            <div className="flex items-center space-x-2">
              <span className="relative flex h-2 w-2">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#ef4444] opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-[#ef4444]"></span>
              </span>
              <span>
                CENTRAL TELEGRÁFICA DE NOTICIAS DE ALICANTE{' '}
                <span className="text-amber-400 font-extrabold bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/30">
                  BY REVOX
                </span>
              </span>
            </div>

            <div className="flex items-center space-x-4">
              <span className="bg-[#ef4444]/10 text-[#ef4444] px-2 py-0.5 rounded border border-[#ef4444]/30 font-bold">
                EN LÍNEA
              </span>
              <span className="text-[#ef4444] font-black text-sm tracking-wider">
                {timeString}
              </span>
              <button
                onClick={() => setTheme(isLight ? 'dark' : 'light')}
                className="hover:text-amber-400 flex items-center space-x-1 transition font-bold"
              >
                {isLight ? <IconMoon className="w-3.5 h-3.5 text-slate-700" /> : <IconSun className="w-3.5 h-3.5 text-amber-400" />}
                <span>{isLight ? 'Modo Oscuro' : 'Modo Claro'}</span>
              </button>
            </div>
          </div>

          {/* TOAST BANNER FOR NEW TELETYPES */}
          {toastMsg && (
            <div className="bg-gradient-to-r from-red-600 via-amber-600 to-red-600 text-white px-4 py-2 font-mono text-xs font-bold text-center flex items-center justify-center space-x-2 animate-pulse shadow-lg border-b border-amber-400 z-50 sticky top-0">
              <span className="bg-black/40 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">ÚLTIMA HORA</span>
              <span className="truncate">{toastMsg}</span>
            </div>
          )}

          {/* TICKER MARQUEE BANNER */}
          <div className={`border-b shadow-lg overflow-hidden ${isLight ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-[#030406] border-[#1e293b] text-[#e2e8f0]'}`}>
            <div className="max-w-full flex items-center h-11 relative">
              <div className="z-10 shrink-0 bg-[#ef4444] text-white px-3.5 h-full flex items-center space-x-2 font-mono font-black text-xs uppercase tracking-widest shadow-md">
                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-90"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
                </span>
                <span>ÚLTIMO TELETIPO</span>
              </div>
              <div className="flex-1 overflow-hidden relative h-full flex items-center group">
                <div className="animate-ticker flex items-center space-x-6 whitespace-nowrap">
                  {[...filteredNews, ...filteredNews].map((item, idx) => (
                    <a
                      key={`${item.id}-${idx}`}
                      href={item.sources[0]?.link || '#'}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center space-x-2.5 px-3 py-1 rounded border bg-[#0d1320] hover:bg-[#162035] border-[#1e293b] text-[#e2e8f0] text-xs transition"
                    >
                      <span className="bg-[#ef4444] text-white text-[10px] font-mono font-black px-1.5 py-0.5 rounded">
                        {new Date(item.publishedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </span>
                      <span className="text-[10px] font-mono font-black uppercase text-amber-400 bg-amber-400/10 px-1.5 py-0.5 rounded border border-amber-400/30">
                        {item.sources[0]?.source || 'OFICIAL'}
                      </span>
                      <span className="font-bold tracking-tight">{item.mainTitle}</span>
                      <IconExternal className="w-3 h-3 text-slate-400 shrink-0" />
                    </a>
                  ))}
                </div>
                <div className="absolute right-3 z-10 hidden sm:flex items-center gap-1.5 text-[10px] font-mono font-bold text-slate-300 bg-black/80 backdrop-blur border border-slate-700/80 px-2 py-0.5 rounded shadow pointer-events-none">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                  <span>Lento • Pasa el ratón para pausar</span>
                </div>
              </div>
            </div>
          </div>

          {/* HEADER */}
          <header className={`${isLight ? 'bg-white border-b border-slate-300' : 'bg-[#050608] border-b border-[#1e293b]'} p-4 shadow-sm`}>
            <div className="max-w-7xl mx-auto space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <div className="flex items-center space-x-3">
                    <h1 className="text-xl sm:text-2xl font-black uppercase tracking-wider">
                      ÚLTIMOS TELETIPOS <span className="text-[#ef4444]">ALICANTE</span>
                    </h1>
                    <span className="bg-amber-500 text-black text-xs font-black px-2 py-0.5 rounded uppercase tracking-wider shadow">
                      BY REVOX
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Agregador de noticias reales en directo de medios y fuentes oficiales de Alicante
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={handleManualRefresh}
                    disabled={isRefreshing}
                    className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white px-3 py-1.5 rounded-sm text-[11px] font-black tracking-widest uppercase flex items-center space-x-1.5 shadow transition border border-emerald-500"
                    title="Cargar y refrescar teletipos con las últimas novedades de Alicante"
                  >
                    <IconRefresh className={`w-4 h-4 ${isRefreshing ? 'animate-spin' : ''}`} />
                    <span>{isRefreshing ? 'CARGANDO...' : 'ACTUALIZAR NOTICIAS'}</span>
                  </button>

                          <IconExternal className="w-3.5 h-3.5" />
                        </a>
                      </div>
                    </div>
                  </section>
                );
              }

              return null;
            })}

          </main>

          {/* FOOTER */}
          <footer className={`${isLight ? 'bg-slate-200 border-slate-300 text-slate-600' : 'bg-[#050608] border-[#1e293b] text-slate-500'} border-t py-6 text-center text-xs font-mono mt-8`}>
            <div className="max-w-7xl mx-auto px-4 space-y-2">
              <p className="font-bold">
                CENTRAL TELEGRÁFICA DE NOTICIAS DE ALICANTE BY REVOX
              </p>
              <p>
                Fuentes autorizadas: 112 CV, Bomberos Alicante, GVA, Sanitat, Cultura, Diputación, Ayto Alicante, Turismo, UA, MARQ, AVAMET, INFORMACIÓN, Todo Alicante, Las Provincias, El Mundo, COPE, Cadena SER, Alicante Plaza, À Punt, Elche CF.
              </p>
              <p className="text-[10px] opacity-70">
                © 2026 TELETIPO ALICANTE. Todos los derechos reservados.
              </p>
            </div>
          </footer>

          {/* MODO REDACCIÓN OVERLAY */}
          {newsroomMode && (
            <div className="fixed inset-0 z-50 bg-black text-white flex flex-col font-sans overflow-hidden">
              <header className="bg-gradient-to-r from-red-950 via-slate-950 to-red-950 border-b-2 border-red-600 px-6 py-3 flex items-center justify-between shadow-2xl">
                <div className="flex items-center space-x-4">
                  <div className="bg-red-600 p-2 rounded-lg border border-red-500 shadow-lg animate-pulse">
                    <IconRadio className="w-8 h-8 text-white" />
                  </div>
                  <div>
                    <h1 className="text-2xl sm:text-3xl font-black tracking-widest text-white uppercase">
                      ÚLTIMOS TELETIPOS ALICANTE BY REVOX
                    </h1>
                    <p className="text-xs text-slate-400 font-mono">MONITOREO DE NOTICIAS EN TIEMPO REAL</p>
                  </div>
                </div>

                <div className="flex items-center space-x-4">
                  <div className="text-right hidden sm:block font-mono">
                    <div className="text-xs text-amber-400">{new Date().toLocaleDateString('es-ES').toUpperCase()}</div>
                    <div className="text-2xl font-black">{timeString}</div>
                  </div>
                  <button onClick={() => setNewsroomMode(false)} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold border border-red-500 flex items-center space-x-1">
                    <IconX className="w-5 h-5" />
                    <span>SALIR DE MODO TV</span>
                  </button>
                </div>
              </header>

              <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 overflow-hidden">
                <div className="lg:col-span-5 bg-slate-900 border-2 border-red-900/80 rounded-2xl p-6 flex flex-col justify-between shadow-2xl">
                  <div>
                    <span className="bg-red-600 text-white font-black text-xs px-3 py-1 rounded uppercase tracking-widest inline-block mb-4">
                      ⭐ DESTACADA DE HOY
                    </span>
                    <h2 className="text-2xl font-black text-white mb-4">{filteredNews[0]?.mainTitle}</h2>
                    <p className="text-sm text-slate-300 leading-relaxed">{filteredNews[0]?.summary}</p>
                  </div>
                  <div className="pt-4 border-t border-slate-800 text-xs text-slate-400">
                    Fuente: <strong className="text-amber-400">{filteredNews[0]?.sources[0]?.source}</strong>
                  </div>
                </div>

                <div className="lg:col-span-7 bg-slate-950 border border-slate-800 rounded-2xl p-6 flex flex-col overflow-hidden">
                  <h3 className="text-lg font-black uppercase text-amber-400 border-b border-slate-800 pb-2 mb-4">
                    🔴 TELETIPO ÚLTIMA HORA EN TIEMPO REAL
                  </h3>
                  <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                    {filteredNews.map(g => (
                      <div key={g.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                        <div className="flex items-center justify-between text-xs mb-1">
                          <span className="font-mono text-amber-400 font-bold">
                            {new Date(g.publishedAt).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}
                          </span>
                          <span className="bg-slate-800 text-slate-300 font-bold px-2 py-0.5 rounded uppercase text-[10px]">{g.category}</span>
                        </div>
                        <h4 className="font-bold text-white text-base">{g.mainTitle}</h4>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PERSONALIZE MODAL */}
          {showPersonalize && (
            <PersonalizeModal
              sectionOrder={sectionOrder}
              sectionVisibility={sectionVisibility}
              onUpdateOrder={(newOrder) => {
                setSectionOrder(newOrder);
                localStorage.setItem('teletipo_section_order', JSON.stringify(newOrder));
              }}
              onToggleVisibility={(key) => {
                const updated = { ...sectionVisibility, [key]: !sectionVisibility[key] };
                setSectionVisibility(updated);
                localStorage.setItem('teletipo_section_visibility', JSON.stringify(updated));
              }}
              onReset={() => {
                const defaultOrder = ['teletipos', 'destacadas', 'radio'];
                const defaultVis = { teletipos: true, destacadas: true, radio: true };
                setSectionOrder(defaultOrder);
                setSectionVisibility(defaultVis);
                localStorage.setItem('teletipo_section_order', JSON.stringify(defaultOrder));
                localStorage.setItem('teletipo_section_visibility', JSON.stringify(defaultVis));
              }}
              onClose={() => setShowPersonalize(false)}
            />
          )}

          {/* ESCALETA MODAL */}
          {showEscaleta && (
            <EscaletaModal
              news={filteredNews}
              onClose={() => setShowEscaleta(false)}
            />
          )}

          {/* SOURCES MODAL */}
          {showSources && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#0a0f18] border border-[#1e293b] p-6 rounded-xl max-w-2xl w-full text-white space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-lg">Fuentes Autorizadas y Redes Oficiales (21 Medios)</h3>
                  <button onClick={() => setShowSources(false)} className="text-slate-400 hover:text-white font-bold"><IconX className="w-5 h-5"/></button>
                </div>
                <div className="space-y-2 text-xs flex-1 overflow-y-auto pr-1">
                  {INITIAL_SOURCES.map(src => (
                    <div key={src.id} className="p-2.5 bg-slate-900 border border-slate-800 rounded flex items-center justify-between">
                      <div className="flex items-center space-x-2">
                        <span className="font-mono font-bold text-amber-400">[{src.type.toUpperCase()}]</span>
                        <span className="font-semibold">{src.name}</span>
                      </div>
                      <a href={src.websiteUrl} target="_blank" rel="noreferrer" className="text-emerald-400 hover:underline font-mono font-bold flex items-center space-x-1">
                        <span>Ver Canal</span>
                        <IconExternal className="w-3 h-3" />
                      </a>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- ESCALETA MODAL COMPONENT ---
    function EscaletaModal({ news, onClose }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [rate, setRate] = useState(1.0);
      const [copied, setCopied] = useState(false);
      const [vuLevels, setVuLevels] = useState(Array(20).fill(4));

      useEffect(() => {
        let interval;
        if (isPlaying && !isPaused) {
          interval = setInterval(() => {
            setVuLevels(Array.from({ length: 20 }, () => Math.floor(Math.random() * 85) + 12));
          }, 70);
        } else {
          setVuLevels(Array(20).fill(4));
        }
        return () => clearInterval(interval);
      }, [isPlaying, isPaused]);

      const topNews = news.slice(0, 6);

      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const daysOfWeek = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const dayName = daysOfWeek[now.getDay()];
      const dayNumber = now.getDate();
      const monthName = months[now.getMonth()];
      const year = now.getFullYear();

      const timeSpoken = `Son las ${hours} ${hours === 1 ? 'hora' : 'horas'} y ${minutes === 0 ? 'en punto' : minutes === 1 ? 'un minuto' : `${minutes} minutos`} del ${dayName}, ${dayNumber} de ${monthName} de ${year}`;
      const introScript = `${timeSpoken}. Emite Central Telegráfica de Noticias de Alicante. Presentamos el boletín informativo con la actualidad más importante de Alicante y provincia en estos últimos minutos.`;

      const newsScripts = topNews.map((group, i) => ({
        index: i + 1,
        title: group.mainTitle,
        spokenText: `${group.mainTitle}. ${group.summary || ''}. Información contrastada por ${group.sources[0]?.source || 'fuente oficial'}.`
      }));

      const outroScript = "Hasta aquí las principales noticias en este boletín de noticias de Alicante. Gracias por su atención y sigan informados de las ultimas noticias en nuestro teletipo en tiempo real. Gracias por escucharnos.";

      const fullText = [introScript, ...newsScripts.map(n => n.spokenText), outroScript].join(' ');

      const handleSpeak = () => {
        if (!('speechSynthesis' in window)) {
          alert('Tu navegador no soporta reproducción de voz.');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'es-ES';
        utterance.rate = rate;
        utterance.onend = () => setIsPlaying(false);
        utterance.onerror = () => setIsPlaying(false);
        setIsPlaying(true);
        setIsPaused(false);
        window.speechSynthesis.speak(utterance);
      };

      const handlePause = () => {
        if ('speechSynthesis' in window) {
          if (isPaused) {
            window.speechSynthesis.resume();
            setIsPaused(false);
          } else {
            window.speechSynthesis.pause();
            setIsPaused(true);
          }
        }
      };

      const handleStop = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsPlaying(false);
        setIsPaused(false);
      };

      const handleCopy = () => {
        const text = `--- BOLETÍN DE RADIO ALICANTE ---\nFecha: ${now.toLocaleDateString()}\n\n[ENTRADILLA]\n${introScript}\n\n[DESARROLLO DE NOTICIAS]\n${newsScripts.map(n => n.spokenText).join('\n\n')}\n\n[CIERRE]\n${outroScript}`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0a0f18] border border-[#1e293b] rounded-xl max-w-3xl w-full text-white flex flex-col max-h-[92vh] overflow-hidden shadow-2xl">
            
            {/* Header */}
            <div className="p-4 border-b border-[#1e293b] bg-slate-950 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className={`p-2 rounded-full border transition ${
                  isPlaying && !isPaused
                    ? 'bg-red-600/30 border-red-500 text-red-500 animate-pulse'
                    : 'bg-slate-900 border-slate-800 text-slate-400'
                }`}>
                  <IconMic className={`w-5 h-5 ${isPlaying && !isPaused ? 'animate-bounce text-red-500' : ''}`} />
                </div>
                <div>
                  <h3 className="font-black text-sm uppercase tracking-wider flex items-center space-x-2">
                    <span>MODO ESCALETA & BOLETÍN DE RADIO</span>
                    <span className="bg-amber-500 text-black text-[10px] font-black px-1.5 py-0.5 rounded">ALICANTE</span>
                  </h3>
                  <p className="text-[11px] text-slate-400 font-mono">Lectura automática del boletín en tiempo real</p>
                </div>
              </div>

              {/* Status Mic Badge */}
              <div className="flex items-center space-x-2">
                {isPlaying && !isPaused ? (
                  <div className="flex items-center space-x-2 bg-red-600/20 border border-red-500/50 px-3 py-1 rounded-full text-red-400 font-mono font-bold text-xs uppercase animate-pulse">
                    <span className="relative flex h-2.5 w-2.5">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                    </span>
                    <span className="tracking-widest">MIC ON AIR</span>
                  </div>
                ) : (
                  <div className="flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-400 font-mono text-xs font-bold uppercase">
                    <span className="w-2 h-2 rounded-full bg-slate-600"></span>
                    <span>MIC EN ESPERA</span>
                  </div>
                )}

                <button onClick={() => { handleStop(); onClose(); }} className="text-slate-400 hover:text-white p-1">
                  <IconX className="w-5 h-5"/>
                </button>
              </div>
            </div>

            {/* Audio Controls Bar */}
            <div className="p-3 bg-[#0f172a] border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center space-x-2">
                {!isPlaying ? (
                  <button onClick={handleSpeak} className="bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded font-black text-xs uppercase flex items-center space-x-1.5 shadow transition">
                    <IconPlay className="w-4 h-4 fill-current" />
                    <span>Escuchar Boletín</span>
                  </button>
                ) : (
                  <>
                    <button onClick={handlePause} className="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded font-black text-xs uppercase flex items-center space-x-1 transition">
                      {isPaused ? <IconPlay className="w-4 h-4" /> : <IconPause className="w-4 h-4" />}
                      <span>{isPaused ? 'Reanudar' : 'Pausar'}</span>
                    </button>
                    <button onClick={handleStop} className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded font-black text-xs uppercase flex items-center space-x-1 transition">
                      <IconSquare className="w-4 h-4" />
                      <span>Detener</span>
                    </button>
                  </>
                )}
                
                <div className="flex items-center space-x-1 text-xs font-mono ml-2">
                  <span className="text-slate-400">Velocidad:</span>
                  {[1.0, 1.2, 1.4].map(r => (
                    <button
                      key={r}
                      onClick={() => setRate(r)}
                      className={`px-2 py-0.5 rounded font-bold ${rate === r ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                    >
                      {r}x
                    </button>
                  ))}
                </div>
              </div>

              <button onClick={handleCopy} className="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-3 py-1.5 rounded flex items-center space-x-1 border border-slate-700 transition">
                {copied ? <IconCheck className="w-4 h-4 text-emerald-400" /> : <IconCopy className="w-4 h-4" />}
                <span>{copied ? 'Copiado' : 'Copiar Guion'}</span>
              </button>
            </div>

            {/* VÚMETRO DIGITAL ESTUDIO */}
            <div className="px-4 py-3 bg-[#050608] border-b border-slate-800/80 space-y-1.5">
              <div className="flex items-center justify-between text-[10px] font-mono font-bold uppercase tracking-widest text-slate-400">
                <div className="flex items-center space-x-2">
                  <span className={`w-2 h-2 rounded-full ${isPlaying && !isPaused ? 'bg-red-500 animate-ping' : 'bg-slate-600'}`}></span>
                  <span>VÚMETRO DIGITAL DE AUDICIÓN EN DIRECTO</span>
                </div>
                <span className={`font-mono text-xs ${isPlaying && !isPaused ? 'text-emerald-400 font-extrabold' : 'text-slate-600'}`}>
                  {isPlaying && !isPaused ? 'PROCESANDO AUDIO EN DIRECTO (-3 dB)' : 'EN ESPERA (STANDBY 0 dB)'}
                </span>
              </div>

              {/* LED Meter Bars */}
              <div className="flex items-end justify-between gap-1 h-12 bg-black/90 p-2 rounded-lg border border-slate-800/80 shadow-inner">
                {vuLevels.map((lvl, idx) => (
                  <div key={idx} className="h-full flex-1 bg-slate-900/80 rounded-xs flex flex-col justify-end overflow-hidden">
                    <div
                      className={`w-full transition-all duration-75 rounded-xs ${
                        lvl > 80
                          ? 'bg-gradient-to-t from-emerald-500 via-amber-400 to-red-500'
                          : lvl > 45
                          ? 'bg-gradient-to-t from-emerald-500 to-amber-400'
                          : 'bg-emerald-500'
                      }`}
                      style={{ height: `${lvl}%` }}
                    />
                  </div>
                ))}
              </div>

              <div className="flex items-center justify-between text-[9px] font-mono text-slate-500 uppercase px-0.5">
                <span>-40 dB</span>
                <span>-20 dB</span>
                <span>-10 dB</span>
                <span className="text-red-500 font-bold">0 dB PEAK</span>
              </div>
            </div>

            {/* Script Text Container */}
            <div className="p-4 overflow-y-auto space-y-4 font-serif text-sm leading-relaxed">
              <div className="p-3 bg-slate-900/90 border border-slate-800 rounded-lg">
                <span className="font-sans font-black text-red-500 text-xs block mb-1 uppercase tracking-wider">CARETA DE ENTRADA:</span>
                "{introScript}"
              </div>

              {newsScripts.map((n, idx) => (
                <div key={idx} className="p-3 bg-[#0f172a] border border-slate-800 rounded-lg">
                  <span className="font-sans font-black text-amber-400 text-xs block mb-1 uppercase tracking-wider">BOLETÍN:</span>
                  "{n.spokenText}"
                </div>
              ))}

              <div className="p-3 bg-slate-900/90 border border-slate-800 rounded-lg">
                <span className="font-sans font-black text-red-500 text-xs block mb-1 uppercase tracking-wider">CARETA DE CIERRE:</span>
                "{outroScript}"
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- PERSONALIZE MODAL COMPONENT ---
    function PersonalizeModal({ sectionOrder, sectionVisibility, onUpdateOrder, onToggleVisibility, onReset, onClose }) {
      const sectionLabels = {
        teletipos: '🔴 ÚLTIMA HORA - ÚLTIMOS TELETIPOS ALICANTE',
        destacadas: '⭐ Las noticias más destacadas de hoy',
        radio: '📻 EMISORAS DE RADIO DE ALICANTE EN DIRECTO'
      };

      const moveSection = (index, direction) => {
        const newOrder = [...sectionOrder];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= newOrder.length) return;
        const temp = newOrder[index];
        newOrder[index] = newOrder[targetIndex];
        newOrder[targetIndex] = temp;
        onUpdateOrder(newOrder);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0a0f18] border border-[#1e293b] rounded-2xl max-w-lg w-full text-white overflow-hidden shadow-2xl space-y-4">
            
            {/* Header */}
            <div className="p-4 bg-gradient-to-r from-amber-950 via-slate-900 to-amber-950 border-b border-amber-500/30 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <IconSliders className="w-5 h-5 text-amber-400" />
                <h3 className="font-black text-sm uppercase tracking-wider text-amber-400">
                  PERSONALIZAR PORTADA Y SECCIONES
                </h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <IconX className="w-5 h-5" />
              </button>
            </div>

            {/* Description */}
            <div className="px-5 text-xs text-slate-300 leading-relaxed">
              Elige qué secciones quieres ver en la portada y cámbiales el orden para priorizar lo que más te interese ver primero:
            </div>

            {/* Section List */}
            <div className="px-5 space-y-3">
              {sectionOrder.map((key, index) => {
                const isVisible = sectionVisibility[key] !== false;
                return (
                  <div
                    key={key}
                    className={`p-3.5 rounded-xl border flex items-center justify-between gap-3 transition ${
                      isVisible ? 'bg-slate-900/90 border-slate-700 text-white' : 'bg-slate-950/60 border-slate-800/60 text-slate-500'
                    }`}
                  >
                    <div className="flex items-center space-x-3 min-w-0">
                      <span className="font-mono text-xs font-bold text-amber-400 shrink-0">#{index + 1}</span>
                      <span className="font-bold text-xs truncate">{sectionLabels[key] || key}</span>
                    </div>

                    <div className="flex items-center space-x-2 shrink-0">
                      {/* Order Up/Down */}
                      <button
                        disabled={index === 0}
                        onClick={() => moveSection(index, -1)}
                        className="p-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:hover:bg-slate-800 text-slate-200"
                        title="Mover arriba"
                      >
                        <IconChevronUp className="w-4 h-4" />
                      </button>
                      <button
                        disabled={index === sectionOrder.length - 1}
                        onClick={() => moveSection(index, 1)}
                        className="p-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:hover:bg-slate-800 text-slate-200"
                        title="Mover abajo"
                      >
                        <IconChevronDown className="w-4 h-4" />
                      </button>

                      {/* Toggle Visibility */}
                      <button
                        onClick={() => onToggleVisibility(key)}
                        className={`px-2.5 py-1 rounded text-[11px] font-bold uppercase transition border ${
                          isVisible
                            ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40'
                            : 'bg-red-500/20 text-red-400 border-red-500/40'
                        }`}
                      >
                        {isVisible ? 'MOSTRAR' : 'OCULTO'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Footer Controls */}
            <div className="p-4 bg-slate-950 border-t border-slate-800/80 flex items-center justify-between">
              <button
                onClick={onReset}
                className="text-xs text-slate-400 hover:text-amber-400 underline font-medium"
              >
                Restablecer orden inicial
              </button>
              <button
                onClick={onClose}
                className="bg-amber-500 hover:bg-amber-400 text-black px-5 py-2 rounded-lg text-xs font-black uppercase tracking-wider shadow"
              >
                Guardar y cerrar
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
